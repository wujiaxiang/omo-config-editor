<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMO Config Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1a1c2e 0%, #0f1117 100%); border-bottom: 1px solid #2a2d3e; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
  .header h1 { font-size: 22px; font-weight: 600; color: #fff; }
  .header h1 span { color: #6c8cff; }
  .header .status { font-size: 13px; color: #888; }
  .header .status.ok { color: #4ade80; }
  .header .status.err { color: #f87171; }
  .container { max-width: 1080px; margin: 0 auto; padding: 24px 32px 80px; }

  .section { margin-bottom: 32px; }
  .section-title { font-size: 16px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid #1f2233; }

  /* Intro / legend */
  .intro-box { background: #151827; border: 1px solid #262a40; border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; line-height: 1.7; font-size: 13.5px; color: #b8bcc8; }
  .intro-box b { color: #e0e0e0; }
  .legend-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; background: #1a1c2e; border: 1px solid #2a2d3e; border-radius: 6px; padding: 5px 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* Flowchart */
  .flow-wrap { background: #10121c; border: 1px solid #262a40; border-radius: 12px; padding: 28px 20px; overflow-x: auto; }
  .flow-grid { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 720px; }
  .flow-row { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; }
  .flow-node { border-radius: 10px; padding: 10px 16px; font-size: 13px; font-weight: 600; text-align: center; border: 1.5px solid; min-width: 100px; }
  .flow-node small { display: block; font-weight: 400; font-size: 10.5px; margin-top: 3px; opacity: 0.85; }
  .flow-node.main { background: #1e2550; border-color: #6c8cff; color: #a5b4ff; }
  .flow-node.plan { background: #24163e; border-color: #c084fc; color: #d8b4fe; }
  .flow-node.exec { background: #16241c; border-color: #4ade80; color: #86efac; }
  .flow-node.consult { background: #241717; border-color: #f87171; color: #fca5a5; }
  .flow-node.grep { background: #1e2230; border-color: #60a5fa; color: #93c5fd; }
  .flow-arrow { color: #4b5065; font-size: 20px; }
  .flow-label { font-size: 11px; color: #6b7280; margin: 2px 0; text-align: center; }

  /* Cards */
  .card { background: #1a1c2e; border: 1px solid #2a2d3e; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; }
  .card:hover { border-color: #3b4060; }
  .card-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .card .name { font-weight: 600; font-size: 15px; min-width: 150px; color: #e0e0e0; }
  .card .name small { display: block; font-weight: 400; font-size: 12px; color: #6b7280; margin-top: 2px; }
  .card .controls { flex: 1; display: flex; gap: 10px; align-items: center; min-width: 300px; flex-wrap: wrap; }
  select, input[type=number], input[type=text] { background: #0f1117; border: 1px solid #2a2d3e; color: #e0e0e0; padding: 8px 10px; border-radius: 6px; font-size: 13px; outline: none; transition: border-color 0.2s; }
  select:focus, input:focus { border-color: #6c8cff; }
  select option { background: #1a1c2e; color: #e0e0e0; }
  .main-select { flex: 1; min-width: 220px; }
  .variant-select { max-width: 100px; }

  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .badge { font-size: 10.5px; padding: 3px 9px; border-radius: 5px; font-weight: 600; white-space: nowrap; }
  .badge.agent { background: #1e3a5f; color: #60a5fa; }
  .badge.category { background: #3b1f4e; color: #c084fc; }
  .badge.free { background: #0f2e1f; color: #34d399; }
  .badge.paid { background: #2e1a1a; color: #f87171; }
  .badge.iq1 { background: #1f2937; color: #9ca3af; }
  .badge.iq2 { background: #1e3a5f; color: #7dd3fc; }
  .badge.iq3 { background: #3b2f1f; color: #fbbf24; }
  .badge.iq4 { background: #3b1f1f; color: #fb923c; }
  .badge.wl1 { background: #1f2937; color: #9ca3af; }
  .badge.wl2 { background: #1e332a; color: #6ee7b7; }
  .badge.wl3 { background: #33291e; color: #fcd34d; }
  .badge.wl4 { background: #331e1e; color: #f87171; }
  .badge.ro { background: #241733; color: #d8b4fe; }
  .badge.freq { background: #1a2333; color: #93a3c9; }

  .adv-toggle { font-size: 12px; color: #6c8cff; cursor: pointer; margin-top: 10px; display: inline-flex; align-items: center; gap: 4px; user-select: none; }
  .adv-toggle:hover { color: #8ba3ff; }
  .adv-panel { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #2a2d3e; }
  .adv-panel.open { display: block; }
  .adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .adv-field label { display: block; font-size: 11px; color: #8b8fa3; margin-bottom: 5px; }
  .adv-field input, .adv-field select { width: 100%; }

  .fallback-section { margin-top: 12px; }
  .fallback-title { font-size: 12px; color: #8b8fa3; margin-bottom: 8px; }
  .fallback-list { display: flex; flex-direction: column; gap: 6px; }
  .fallback-row { display: flex; gap: 8px; align-items: center; }
  .fallback-row select { flex: 1; }
  .fb-remove { background: #2e1a1a; color: #f87171; border: none; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; line-height: 1; }
  .fb-remove:hover { background: #3b1f1f; }
  .fb-add { background: #1a2333; color: #6c8cff; border: 1px dashed #2a3450; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; margin-top: 6px; }
  .fb-add:hover { background: #202b42; }
  .fb-readonly-note { font-size: 11px; color: #6b7280; font-style: italic; margin-top: 4px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #b8bcc8; }
  .checkbox-row input { width: 16px; height: 16px; }

  .btn-bar { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; position: sticky; bottom: 16px; }
  .btn { padding: 10px 28px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
  .btn-primary { background: #6c8cff; color: #fff; }
  .btn-primary:hover { background: #5a7aee; }
  .btn-primary:disabled { background: #3a3d4e; color: #666; cursor: not-allowed; }
  .btn-secondary { background: #1f2233; color: #9ca3af; border: 1px solid #2a2d3e; }
  .btn-secondary:hover { background: #2a2d3e; color: #e0e0e0; }
  .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; z-index: 999; transform: translateY(80px); opacity: 0; transition: all 0.3s ease; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.ok { background: #166534; color: #4ade80; border: 1px solid #22c55e; }
  .toast.err { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }
.loading { text-align: center; padding: 60px; color: #6b7280; font-size: 16px; }
    @media (max-width: 640px) {
      .card-top { flex-direction: column; align-items: flex-start; }
      .card .name { min-width: auto; }
      .card .controls { width: 100%; }
    }
    /* Tabs */
    .tab-container {
      display: flex;
      border-bottom: 1px solid #2a2d3e;
      margin-bottom: 20px;
    }
    .tab-button {
      background: #1a1c2e;
      border: none;
      color: #9ca3af;
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .tab-button.active {
      color: #fff;
      border-bottom: 2px solid #6c8cff;
    }
    .tab-button:hover:not(.active) {
      background: #1f2233;
      color: #e0e0e0;
    }
    .tab-panel {
      display: none;
      animation: fadeEffect 0.3s;
    }
    .tab-panel.active {
      display: block;
    }
    @keyframes fadeEffect {
      from {opacity: 0;}
      to {opacity: 1;}
    }
    /* CCR Tab Styles */
    .ccr-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .ccr-table th, .ccr-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #2a2d3e; font-size: 13px; }
    .ccr-table th { color: #9ca3af; font-weight: 600; background: #151827; }
    .ccr-table tr:hover { background: #1a1c2e; }
    .ccr-route-card { background: #1a1c2e; border: 1px solid #2a2d3e; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .ccr-route-card:hover { border-color: #3b4060; }
    .ccr-route-label { font-weight: 600; font-size: 14px; min-width: 120px; color: #e0e0e0; }
    .ccr-route-label small { display: block; font-weight: 400; font-size: 11px; color: #6b7280; margin-top: 2px; }
    .ccr-route-controls { flex: 1; display: flex; gap: 10px; align-items: center; min-width: 300px; }
    .ccr-route-controls select { flex: 1; min-width: 150px; }
    .ccr-provider-card { background: #1a1c2e; border: 1px solid #2a2d3e; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; }
    .ccr-provider-card:hover { border-color: #3b4060; }
    .ccr-provider-header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .ccr-provider-name { font-weight: 600; font-size: 15px; color: #e0e0e0; }
    .ccr-provider-name small { display: block; font-weight: 400; font-size: 12px; color: #6b7280; margin-top: 2px; }
    .ccr-provider-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .ccr-badge { font-size: 10.5px; padding: 3px 9px; border-radius: 5px; font-weight: 600; white-space: nowrap; }
    .ccr-badge.anthropic { background: #24163e; color: #c084fc; }
    .ccr-badge.openai { background: #1e3a5f; color: #60a5fa; }
    .ccr-badge.custom { background: #16241c; color: #4ade80; }
    .ccr-models-toggle { font-size: 12px; color: #6c8cff; cursor: pointer; margin-top: 10px; display: inline-flex; align-items: center; gap: 4px; user-select: none; }
    .ccr-models-toggle:hover { color: #8ba3ff; }
    .ccr-models-list { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #2a2d3e; }
    .ccr-models-list.open { display: block; }
    .ccr-models-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .ccr-model-tag { font-size: 11px; padding: 4px 8px; background: #0f1117; border: 1px solid #2a2d3e; border-radius: 4px; color: #b8bcc8; }
    .ccr-anthropic-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .ccr-anthropic-table th, .ccr-anthropic-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #2a2d3e; font-size: 13px; }
    .ccr-anthropic-table th { color: #9ca3af; font-weight: 600; background: #151827; }
    .ccr-anthropic-table tr:hover { background: #1a1c2e; }
  </style>
</head>
<body>
<div class="header">
  <h1><span>OMO</span> Config Editor</h1>
  <div class="status" id="status">Loading...</div>
</div>
<div class="container" id="app">
  <div class="tab-container">
    <button class="tab-button active" data-tab="omo">OMO Config</button>
    <button class="tab-button" data-tab="ccr">CCR Models</button>
  </div>
  <div class="tab-panel active" id="omo-tab-panel">
    <div class="loading">Loading config...</div>
  </div>
  <div class="tab-panel" id="ccr-tab-panel">
    <div class="loading">Loading CCR config...</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let config = null;
let models = [];
let ccrConfig = null;

// iq: 1=低 2=中 3=高 4=极高    wl(工作量/调用频率): 1=低 2=中 3=高 4=极高
const AGENT_META = {
  sisyphus:            { role: '主编排器',   desc: '总指挥，协调所有 agent',       iq: 3, wl: 4, readonly: false, freq: '常驻主对话' },
  hephaestus:          { role: '深度执行者', desc: '负责复杂实现',                 iq: 3, wl: 4, readonly: false, freq: '按需调用' },
  librarian:           { role: '文档/代码检索员', desc: '外部库文档、OSS 用法查找', iq: 2, wl: 2, readonly: true,  freq: '遇到不熟悉的库时调用' },
  prometheus:          { role: '策略规划师', desc: '制定工作计划',                 iq: 3, wl: 2, readonly: false, freq: '规划阶段调用' },
  atlas:               { role: '总编排师',   desc: '任务分发与管理',               iq: 2, wl: 3, readonly: false, freq: '执行阶段常用' },
  oracle:              { role: '只读顾问',   desc: '高 IQ 推理，只读不写',         iq: 4, wl: 1, readonly: true,  freq: '省着用，关键决策' },
  metis:                { role: '预规划顾问', desc: '分析需求、识别歧义',           iq: 3, wl: 1, readonly: true,  freq: '规划前调用' },
  momus:                { role: '方案审查官', desc: '审查计划质量',                 iq: 4, wl: 1, readonly: true,  freq: '省着用，方案审查' },
  explore:              { role: '代码搜索',   desc: '代码库上下文搜索（智能 grep）', iq: 1, wl: 4, readonly: true,  freq: '高频并行调用' },
  'multimodal-looker':  { role: '多模态分析', desc: '分析图片/PDF/媒体',            iq: 2, wl: 1, readonly: true,  freq: '偶尔调用' },
  'sisyphus-junior':    { role: '轻量执行者', desc: '被委派的具体任务执行（无法再委派）', iq: 2, wl: 4, readonly: false, freq: 'category 任务实际执行者，高频' },
};

const CATEGORY_META = {
  'visual-engineering': { desc: '前端/UI/UX/动画/样式',      iq: 3, wl: 3 },
  'ultrabrain':         { desc: '高难度逻辑/架构决策',        iq: 4, wl: 2 },
  'deep':               { desc: '深度自主研究+落地实现',      iq: 3, wl: 4 },
  'artistry':           { desc: '非常规创意方案',              iq: 3, wl: 2 },
  'quick':              { desc: '简单快速任务，单文件改动',    iq: 1, wl: 1 },
  'unspecified-low':    { desc: '未分类，低强度',              iq: 1, wl: 1 },
  'unspecified-high':   { desc: '未分类，高强度',              iq: 2, wl: 3 },
  'writing':            { desc: '文档/写作/说明',              iq: 2, wl: 2 },
};

const IQ_LABEL = { 1: '低', 2: '中', 3: '高', 4: '极高' };
const WL_LABEL = { 1: '低', 2: '中', 3: '高', 4: '极高' };

function providerOf(model) {
  if (!model) return '';
  return model.split('/')[0];
}
function isFree(model) {
  if (!model) return false;
  return model.includes(':free') || model.includes('-free');
}
function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(() => el.className = 'toast', 3000);
}

function modelOptionsHtml(selectedModel) {
  let html = '';
  let currentProvider = '';
  html += `<option value="">-- 无 --</option>`;
  for (const m of models) {
    const p = providerOf(m);
    if (p !== currentProvider) {
      if (currentProvider) html += '</optgroup>';
      currentProvider = p;
      html += `<optgroup label="${p}">`;
    }
    const sel = m === selectedModel ? ' selected' : '';
    html += `<option value="${m}"${sel}>${m}</option>`;
  }
  if (currentProvider) html += '</optgroup>';
  return html;
}

function renderMainSelect(selectedModel) {
  let html = `<select class="main-select" data-original="${selectedModel || ''}">`;
  let currentProvider = '';
  for (const m of models) {
    const p = providerOf(m);
    if (p !== currentProvider) {
      if (currentProvider) html += '</optgroup>';
      currentProvider = p;
      html += `<optgroup label="${p}">`;
    }
    const sel = m === selectedModel ? ' selected' : '';
    html += `<option value="${m}"${sel}>${m}</option>`;
  }
  if (currentProvider) html += '</optgroup>';
  html += '</select>';
  return html;
}

function variantSelect(current) {
  const opts = ['', 'low', 'medium', 'high'];
  let html = '<select class="variant-select" title="Variant / Reasoning Effort">';
  for (const v of opts) {
    const sel = v === (current || '') ? ' selected' : '';
    const label = v || '默认';
    html += `<option value="${v}"${sel}>${label}</option>`;
  }
  html += '</select>';
  return html;
}

function fallbackHtml(cfg) {
  const list = Array.isArray(cfg.fallback_models) ? cfg.fallback_models : [];
  const hasComplex = list.some(x => typeof x !== 'string');
  if (hasComplex) {
    return `<div class="fallback-section">
      <div class="fallback-title">降级模型 (Fallback Models)</div>
      <div class="fb-readonly-note">⚠ 检测到高级 fallback 配置（含 per-model 参数），此界面暂不支持编辑，保存时将原样保留。请直接编辑 JSON 文件。</div>
    </div>`;
  }
  let rows = '';
  list.forEach((m) => {
    rows += `<div class="fallback-row"><select class="fb-select">${modelOptionsHtml(m)}</select><button type="button" class="fb-remove" onclick="removeFallback(this)">×</button></div>`;
  });
  return `<div class="fallback-section">
    <div class="fallback-title">降级模型 (Fallback Models) — 主模型出错/超限时按顺序尝试</div>
    <div class="fallback-list">${rows}</div>
    <button type="button" class="fb-add" onclick="addFallback(this)">+ 添加降级模型</button>
  </div>`;
}

function addFallback(btn) {
  const section = btn.parentElement;
  const list = section.querySelector('.fallback-list');
  const row = document.createElement('div');
  row.className = 'fallback-row';
  row.innerHTML = `<select class="fb-select">${modelOptionsHtml('')}</select><button type="button" class="fb-remove" onclick="removeFallback(this)">×</button>`;
  list.appendChild(row);
}
function removeFallback(btn) {
  btn.parentElement.remove();
}

function advPanelHtml(cfg, uid) {
  const temp = cfg.temperature ?? '';
  const topP = cfg.top_p ?? '';
  const tools = Array.isArray(cfg.tools) ? cfg.tools.join(', ') : (cfg.tools || '');
  const disabled = !!cfg.disable;
  return `
    <div class="adv-panel" id="adv-${uid}">
      <div class="adv-grid">
        <div class="adv-field">
          <label>Temperature</label>
          <input type="number" step="0.1" min="0" max="2" class="adv-temperature" value="${temp}" placeholder="默认">
        </div>
        <div class="adv-field">
          <label>Top P</label>
          <input type="number" step="0.05" min="0" max="1" class="adv-top_p" value="${topP}" placeholder="默认">
        </div>
        <div class="adv-field">
          <label>Tools 白名单 (逗号分隔，留空=全部)</label>
          <input type="text" class="adv-tools" value="${tools}" placeholder="e.g. read, grep, bash">
        </div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" class="adv-disable" ${disabled ? 'checked' : ''} id="disable-${uid}">
        <label for="disable-${uid}">禁用此 agent（disable）</label>
      </div>
    </div>`;
}

function iqBadge(iq) { return `<span class="badge iq${iq}">🧠 智力:${IQ_LABEL[iq]}</span>`; }
function wlBadge(wl) { return `<span class="badge wl${wl}">⚙️ 工作量:${WL_LABEL[wl]}</span>`; }

function render() {
  const omoPanel = document.getElementById('omo-tab-panel');
  if (!config) return;
  let html = '';

  html += `
  <div class="section">
    <div class="intro-box">
      <b>这是什么？</b> OMO（Oh My OpenAgent）把一个 AI 主对话拆成多个「专家 Agent」协作完成任务。每个专家可以单独指定模型 —— 越聪明的模型越贵/越慢，越常被调用的专家越该用便宜/免费模型。
      <br><br>
      <b>怎么决策？</b> 看下面每张卡片的两个标签：<b>🧠 智力需求</b>（这个专家做的事有多难，需要多强的推理能力）和 <b>⚙️ 工作量</b>（被调用的频率/输出量有多大）。
      <br>
      → <b>高智力 + 低工作量</b>：用最贵的模型也不心疼（oracle、momus，省着用但每次都要准）。
      <br>

function toggleAdv(uid) {
  const el = document.getElementById('adv-' + uid);

}

async function saveConfig() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';

  document.querySelectorAll('.card').forEach(card => {
    const key = card.dataset.key;
    const name = card.dataset.name;
    const model = card.querySelector('select.main-select').value;
    const variant = card.querySelector('.variant-select').value;
    const temperature = card.querySelector('.adv-temperature').value;
    const topP = card.querySelector('.adv-top_p').value;
    const toolsStr = card.querySelector('.adv-tools').value;
    const disable = card.querySelector('.adv-disable').checked;

    const target = key === 'agent' ? config.agents : config.categories;
    if (!target[name]) target[name] = {};
    const cfg = target[name];

    cfg.model = model;
    if (variant) cfg.variant = variant; else delete cfg.variant;
    if (temperature !== '') cfg.temperature = parseFloat(temperature); else delete cfg.temperature;
    if (topP !== '') cfg.top_p = parseFloat(topP); else delete cfg.top_p;
    if (toolsStr.trim()) cfg.tools = toolsStr.split(',').map(s => s.trim()).filter(Boolean); else delete cfg.tools;
    if (disable) cfg.disable = true; else delete cfg.disable;

    const fbSelects = card.querySelectorAll('.fb-select');
    const hasReadonlyNote = card.querySelector('.fb-readonly-note');
    if (!hasReadonlyNote) {
      const fbValues = Array.from(fbSelects).map(s => s.value).filter(Boolean);
      if (fbValues.length) cfg.fallback_models = fbValues; else delete cfg.fallback_models;
    }
  });

  try {
    const res = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    });
    const data = await res.json();
    if (data.ok) {
      toast('配置已保存 ✓ (重启 OpenCode 生效)');
      document.getElementById('status').textContent = 'Saved ✓';
      document.getElementById('status').className = 'status ok';
    } else {
      toast('保存失败: ' + data.error, false);
    }
  } catch (e) {
    toast('网络错误: ' + e.message, false);
  }

  btn.disabled = false;
  btn.textContent = '保存配置';
}

async function fetchCCRConfig() {
  try {
    const res = await fetch('/api/ccr/config');
    const data = await res.json();
    if (data.ok) {
      ccrConfig = data.config;
      return true;
    } else {
      throw new Error(data.error);
    }
  } catch (e) {
    console.error('Failed to fetch CCR config:', e);
    return false;
  }
}

// Normalize a model entry (may be a plain string id or a detailed object) to its id string
function modelId(m) {
  return typeof m === 'string' ? m : m.id;
}
// Get array of model id strings from a provider's models[] (mixed string/object)
function modelIds(provider) {
  return (provider?.models || []).map(modelId);
}

// 从 qualified "provider/model" 格式中提取裸模型名
function bareModel(qualified) {
  const i = qualified.indexOf('/');
  return i >= 0 ? qualified.slice(i + 1) : qualified;
}

// 从 qualified "provider/model" 中提取 provider 名
function providerFromQualified(qualified) {
  const i = qualified.indexOf('/');
  return i >= 0 ? qualified.slice(0, i) : null;
}

// Working in-memory copy of the 3 chains: { opus: [modelId,...], sonnet: [...], haiku: [...] }
let ccrChains = null;
let ccrRetryCount = { opus: 1, sonnet: 1, haiku: 1 };

function buildChainsFromConfig() {
  const rules = ccrConfig.Router?.rules || [];
  const findRule = (id) => rules.find(r => r.id === id);
  const opusRule = findRule('fallback-opus');
  const sonnetRule = findRule('fallback-sonnet');
  const haikuRule = findRule('fallback-haiku');
  ccrChains = {
    opus: (opusRule?.fallback?.models || []).slice(),
    sonnet: (sonnetRule?.fallback?.models || []).slice(),
    haiku: (haikuRule?.fallback?.models || []).slice(),
  };
  ccrRetryCount = {
    opus: opusRule?.fallback?.retryCount ?? 1,
    sonnet: sonnetRule?.fallback?.retryCount ?? 1,
    haiku: haikuRule?.fallback?.retryCount ?? 1,
  };
}

function findProviderForModel(modelIdToFind) {
  const providers = ccrConfig.Providers || [];
  if (!modelIdToFind) return null;
  // 如果有 provider/ 前缀，直接取前缀部分
  const slashIdx = modelIdToFind.indexOf('/');
  if (slashIdx > 0) {
    const providerName = modelIdToFind.slice(0, slashIdx);
    const bare = modelIdToFind.slice(slashIdx + 1);
    // 先精确匹配 provider 名
    if (providers.find(p => p.name === providerName || p.id === providerName)) {
      return providerName;
    }
    // 然后用裸名在 provider 的 models 里找
    for (const p of providers) {
      if (modelIds(p).includes(bare)) return p.name;
    }
  }
  // 否则用原始值遍历（兼容裸名查找）
  for (const p of providers) {
    if (modelIds(p).includes(modelIdToFind)) return p.name;
  }
  return null;
}

                      border-radius: 4px; color: #e8eaed; font-size: 13px; text-align: center;">

  });

  container.innerHTML = html;

function renderFallbackRow(kind, modelId, indexInChain, chainLength) {
  const providerName = providerFromQualified(modelId) || findProviderForModel(modelId) || '?';
  const badgeNum = indexInChain + 1; // since primary is ①
  return `
    <div class="fallback-row" data-kind="${kind}" data-model="${modelId}">
      <span class="ccr-badge" style="background:#1f2937;color:#9ca3af; min-width:22px; text-align:center;">${badgeNum}</span>
      <span style="flex:1; font-size:13px; color:#e0e0e0;">${modelId} <small style="color:#6b7280;">(${providerName})</small></span>
      <button class="fb-remove" data-action="move-up" data-kind="${kind}" data-model="${modelId}" title="上移" ${indexInChain === 0 ? 'disabled style="opacity:0.3;cursor:not-allowed;"' : ''}>↑</button>
      <button class="fb-remove" data-action="move-down" data-kind="${kind}" data-model="${modelId}" title="下移">↓</button>
      <button class="fb-remove" data-action="remove-fallback" data-kind="${kind}" data-model="${modelId}" title="删除">✕</button>
    </div>`;
}

function bindChainEvents() {
  const providers = ccrConfig.Providers || [];

  // Primary provider change -> repopulate primary model select
  document.querySelectorAll('.chain-primary-provider').forEach(sel => {
    sel.addEventListener('change', () => {
      const kind = sel.getAttribute('data-kind');
      const provider = providers.find(p => p.name === sel.value);
      const modelSel = document.querySelector(`.chain-primary-model[data-kind="${kind}"]`);
      modelSel.innerHTML = '<option value="">-- Model --</option>' +
        modelIds(provider).map(m => `<option value="${m}">${m}</option>`).join('');
    });
  });

  // Primary model change -> update ccrChains so old primary moves to fallback
  document.querySelectorAll('.chain-primary-model').forEach(sel => {
    sel.addEventListener('change', () => {
      const kind = sel.getAttribute('data-kind');
      const newPrimary = sel.value;
      if (!newPrimary) return;
      const oldChain = ccrChains[kind] || [];
      const oldPrimary = oldChain[0] || '';
      if (oldPrimary === newPrimary) return;
      // Move old primary to first fallback slot if not already there
      const rest = oldChain.slice(1).filter(m => m !== newPrimary);
      if (oldPrimary && !rest.includes(oldPrimary)) {
        rest.unshift(oldPrimary);
      }
      ccrChains[kind] = [newPrimary, ...rest];
      toast(`首选模型已切换 → 旧模型 ${oldPrimary} 自动移至降级候选`, true);
      renderChainCards(); // re-render to show updated fallback list
    });
  });

  // Add-fallback provider change -> repopulate add-fallback model select
  document.querySelectorAll('.chain-add-provider').forEach(sel => {
    sel.addEventListener('change', () => {
      const kind = sel.getAttribute('data-kind');
      const provider = providers.find(p => p.name === sel.value);
      const modelSel = document.querySelector(`.chain-add-model[data-kind="${kind}"]`);
      modelSel.innerHTML = '<option value="">-- Model --</option>' +
        modelIds(provider).map(m => `<option value="${m}">${m}</option>`).join('');
    });
  });

  // Add fallback button
  document.querySelectorAll('[data-action="add-fallback"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const kind = btn.getAttribute('data-kind');
      const modelSel = document.querySelector(`.chain-add-model[data-kind="${kind}"]`);
      const modelId = modelSel.value;
      if (!modelId) { toast('请先选择要添加的模型', false); return; }
      if (!ccrChains[kind]) ccrChains[kind] = [];
      if (ccrChains[kind].includes(modelId)) { toast('该模型已在链中', false); return; }
      ccrChains[kind].push(modelId);
      renderChainCards();
    });
  });

  // Move up / down / remove fallback
  document.querySelectorAll('[data-action="move-up"], [data-action="move-down"], [data-action="remove-fallback"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const kind = btn.getAttribute('data-kind');
      const modelId = btn.getAttribute('data-model');
      const action = btn.getAttribute('data-action');
      const chain = ccrChains[kind];
      const idx = chain.indexOf(modelId);
      if (idx === -1) return;
      if (action === 'remove-fallback') {
        chain.splice(idx, 1);
      } else if (action === 'move-up' && idx > 1) {
        // idx>1 because idx===1 is the first fallback item right after primary(idx 0); allow swapping among fallback items only
        [chain[idx - 1], chain[idx]] = [chain[idx], chain[idx - 1]];
      } else if (action === 'move-down' && idx < chain.length - 1) {
        [chain[idx + 1], chain[idx]] = [chain[idx], chain[idx + 1]];
      }
      renderChainCards();
    });
  });

  // Save button per kind
  document.querySelectorAll('.chain-save-btn').forEach(btn => {
    btn.addEventListener('click', () => saveChain(btn.getAttribute('data-kind'), btn));
  });
}

function renderGlobalFallback() {
  const listEl = document.getElementById('ccr-global-fallback-list');
  const provSel = document.getElementById('ccr-gf-provider');
  const modelSel = document.getElementById('ccr-gf-model');
  if (!listEl || !provSel || !modelSel) return;
  const providers = ccrConfig.Providers || [];

  // 渲染当前全局 fallback 模型标签
  const gf = ccrConfig.Router?.fallback;
  const models = gf?.models || [];
  listEl.innerHTML = models.map((m, i) => {
    const pn = findProviderForModel(m.split('/').slice(-1)[0]) || '?';
    return `<span style="display:inline-flex;align-items:center;gap:4px;background:#1f2937;border:1px solid #32364a;border-radius:4px;padding:4px 8px;font-size:12px;color:#e0e0e0;">
      ${m} <small style="color:#6b7280;">(${pn})</small>
      <span onclick="removeGlobalFallbackModel('${m}')" style="cursor:pointer;color:#ef4444;margin-left:2px;">✕</span>
    </span>`;
  }).join('') || '<span style="color:#6b7280;font-size:13px;">（未配置，使用默认降级策略）</span>';

  // 填充 provider 下拉
  provSel.innerHTML = '<option value="">-- Provider --</option>' +
    providers.map(p => `<option value="${p.name}">${p.name}</option>`).join('');

  // provider 变化时联动模型下拉
  provSel.onchange = () => {
    const p = providers.find(pv => pv.name === provSel.value);
    modelSel.innerHTML = '<option value="">-- 模型 --</option>' +
      (p ? p.models.map(m => `<option value="${m}">${m}</option>`).join('') : '');
  };

  // + 添加 按钮
  document.getElementById('ccr-gf-add-btn').onclick = () => {
    const model = modelSel.value;
    if (!model) { toast('请先选择模型', false); return; }
    const pn = findProviderForModel(model);
    const qualified = pn ? `${pn}/${model}` : model;
    if (!ccrConfig.Router) ccrConfig.Router = {};
    if (!ccrConfig.Router.fallback) ccrConfig.Router.fallback = { mode: 'model-chain', models: [], retryCount: 1 };
    if (ccrConfig.Router.fallback.models.includes(qualified)) { toast('已在链中', false); return; }
    ccrConfig.Router.fallback.models.push(qualified);
    renderGlobalFallback();
  };

  // 保存按钮
  document.getElementById('ccr-gf-save-btn').onclick = async () => {
    if (!ccrConfig.Router) ccrConfig.Router = {};
    if (!ccrConfig.Router.fallback) ccrConfig.Router.fallback = { mode: 'model-chain', models: [], retryCount: 1 };
    ccrConfig.Router.fallback.mode = 'model-chain';
    // 用完整 config 覆盖保存
    const res = await fetch('/api/ccr/config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ccrConfig),
    });
    const data = await res.json();
    if (data.ok) {
      toast('全局降级策略已保存 ✓', true);
    } else {
      toast('保存失败: ' + (data.error || 'unknown'), false);
    }
  };
}

function removeGlobalFallbackModel(modelId) {
  if (!ccrConfig.Router?.fallback?.models) return;
  ccrConfig.Router.fallback.models = ccrConfig.Router.fallback.models.filter(m => m !== modelId);
  renderGlobalFallback();
}

async function saveChain(kind, btn) {
  btn.disabled = true;
  const origText = btn.textContent;
  btn.textContent = '保存中...';

  const primaryModelSel = document.querySelector(`.chain-primary-model[data-kind="${kind}"]`);
  const primaryModel = primaryModelSel ? primaryModelSel.value : '';

  if (!primaryModel) {
    toast('请先选择首选模型', false);
    btn.disabled = false;
    btn.textContent = origText;
    return;
  }

  // 将每个模型名转换为 qualified provider/model 格式，避免多个 provider 有同名模型时降级歧义
  // 如果已有 provider 前缀（含 '/'），说明已经是 qualified，不要再拼一次
  const qualifyModel = (m) => {
    if (m.indexOf('/') >= 0) return m; // 已是 qualified，直接返回
    const p = findProviderForModel(m);
    return p ? `${p}/${m}` : m;
  };
  const fallbackRest = (ccrChains[kind] || []).slice(1);
  const fullChain = [qualifyModel(primaryModel), ...fallbackRest.filter(m => m !== primaryModel).map(qualifyModel)];
  ccrChains[kind] = fullChain;

  // Update Router.rules[fallback-<kind>].fallback.models
  if (!ccrConfig.Router) ccrConfig.Router = {};
  if (!ccrConfig.Router.rules) ccrConfig.Router.rules = [];
  const ruleId = 'fallback-' + kind;
  let rule = ccrConfig.Router.rules.find(r => r.id === ruleId);
  const primaryProviderName = findProviderForModel(primaryModel);
  const qualifiedPrimaryModel = primaryProviderName ? `${primaryProviderName}/${primaryModel}` : primaryModel;
  if (!primaryProviderName) {
    console.warn(`[saveChain] Could not find provider for model "${primaryModel}"; writing unqualified model name, this WILL cause 400 model_not_supported errors.`);
  }
  if (!rule) {
    rule = {
      id: ruleId,
      name: kind.charAt(0).toUpperCase() + kind.slice(1) + ' fallback chain',
      type: 'condition',
      enabled: true,
      // condition 必须用 == + 全名，CCR 的 Nm() 只认 == 操作符，ends-with 会被 strip 成 null
      // CC 通过 cloudcli 发送的一直是全名（如 opencode-zen/mimo-v2.5-free），没有裸名情况
      condition: { left: 'request.body.model', operator: '==', right: qualifiedPrimaryModel },
      fallback: { mode: 'model-chain', models: [], retryCount: 1 }
    };
    ccrConfig.Router.rules.push(rule);
  } else {
    rule.condition = { left: 'request.body.model', operator: '==', right: qualifiedPrimaryModel };
  }
  // condition 规则必须有 rewrite 才能被 CCR 标记为 active（否则 fallback 不会被使用）
  // 加一条无害的 rewrite：把模型名设为自己（无实际效果，但激活规则）
  rule.rewrites = [{ key: 'request.body.model', operation: 'set', value: qualifiedPrimaryModel }];
  if (!rule.fallback) rule.fallback = { mode: 'model-chain', models: [], retryCount: 1 };
  // 从 UI 读取重试次数
  const retryInput = document.querySelector(`.chain-retry-count[data-kind="${kind}"]`);
  const retryVal = retryInput ? parseInt(retryInput.value, 10) : 1;
  if (!Number.isFinite(retryVal) || retryVal < 0) {
    toast('重试次数必须是 ≥0 的数字', false);
    btn.disabled = false; btn.textContent = origText; return;
  }
  rule.fallback.retryCount = retryVal;
  ccrRetryCount[kind] = retryVal;
  // 降级链用全名 (provider/model)，这样失败时直接路由到指定 provider，避免裸名回绕到同个 provider
  // condition.right 仍用裸名 (ends-with 匹配兼容裸名/全名)
  rule.fallback.models = fullChain;

  // Update profile.claudeCode.<kind>Model
  // 官方 schema 要求这三个字段是 "Provider name/model name" 完整格式，不能只写裸模型 ID
  // （2026-07-30 修复：之前这里直接塞裸 primaryModel，导致 opus/sonnet/haiku 别名请求全部 400 model_not_supported）
  if (!ccrConfig.profile) ccrConfig.profile = {};
  if (!ccrConfig.profile.claudeCode) ccrConfig.profile.claudeCode = {};
  ccrConfig.profile.claudeCode[kind + 'Model'] = qualifiedPrimaryModel;
  ccrConfig.profile.claudeCode.model = ccrConfig.profile.claudeCode.model || qualifiedPrimaryModel; // 必填顶层字段，若为空则一并补上，避免 "No available models" 报错

  // Update profile.profiles[claude-code].<kind>Model
  if (!ccrConfig.profile.profiles) ccrConfig.profile.profiles = [];
  let ccProfile = ccrConfig.profile.profiles.find(p => p.agent === 'claude-code');
  if (!ccProfile) {
    ccProfile = { agent: 'claude-code', id: 'default-claude-code', name: 'Claude Code', enabled: true };
    ccrConfig.profile.profiles.push(ccProfile);
  }
  ccProfile[kind + 'Model'] = qualifiedPrimaryModel;

  try {
    const res = await fetch('/api/ccr/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ccrConfig),
    });
    const data = await res.json();
    if (data.ok) {
      const viaRpc = data.viaRpc;
      toast(kind.toUpperCase() + ' 已保存 ✓' + (viaRpc ? '' : ' (需重启 CCR 生效)'));
    } else {
      toast('保存失败: ' + data.error, false);
    }
  } catch (e) {
    toast('网络错误: ' + e.message, false);
  }

  btn.disabled = false;
  btn.textContent = origText;
}


function showTab(tabName) {
  // Update tab buttons
  document.querySelectorAll('.tab-button').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
  });
  // Update tab panels
  document.querySelectorAll('.tab-panel').forEach(panel => {
    panel.classList.toggle('active', panel.id === tabName + '-tab-panel');
  });
  // Load CCR data if switching to CCR tab
  if (tabName === 'ccr' && !ccrConfig) {
    renderCCR();
  }
}

async function init() {
  try {
    const [configRes, modelsRes] = await Promise.all([
      fetch('/api/config'),
      fetch('/api/models'),
    ]);
    const configData = await configRes.json();
    const modelsData = await modelsRes.json();

    if (!configData.ok) throw new Error(configData.error);
    config = configData.config;

    if (!modelsData.ok) throw new Error(modelsData.error);
    models = modelsData.models;

    document.getElementById('status').textContent = `Loaded ${Object.keys(config.agents || {}).length} agents, ${Object.keys(config.categories || {}).length} categories, ${models.length} models`;
    document.getElementById('status').className = 'status ok';

    // Render OMO config into the OMO tab panel
    render();
    // Show OMO tab by default
    showTab('omo');

    // Set up tab button click listeners
    document.querySelectorAll('.tab-button').forEach(button => {
      button.addEventListener('click', () => {
        const tab = button.getAttribute('data-tab');
        showTab(tab);
      });
    });
  } catch (e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
    document.getElementById('status').className = 'status err';
    // Show error in OMO panel
    const omoPanel = document.getElementById('omo-tab-panel');
    omoPanel.innerHTML = `<div class="loading">加载失败: ${e.message}</div>`;
  }
}

init();
</script>
