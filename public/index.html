<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMO Config Editor</title>
<style>
  /* ============ Design tokens: warm signal console ============ */
  :root {
    --bg: #0d0b09;
    --bg-raise: #131009;
    --panel: #191510;
    --panel-2: #211c16;
    --panel-3: #28221b;
    --line: #2b251e;
    --line-strong: #3a322a;
    --ink: #e7e0d4;
    --ink-dim: #a69c8b;
    --ink-faint: #6e655a;
    --amber: #e8a33d;
    --amber-hi: #ffb654;
    --violet: #a78bfa;
    --green: #7fc98a;
    --coral: #e8715f;
    --cyan: #6bb7c9;
    --rose: #e08aa6;
    --fam-claude: #e39a6b;
    --fam-gpt: #5cbfa8;
    --fam-gemini: #6fa8ff;
    --fam-kimi: #cd78d8;
    --fam-minimax: #e3b23c;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'JetBrains Mono', Consolas, 'Liberation Mono', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); min-height: 100vh; font-size: 14px; line-height: 1.6; }
  ::selection { background: rgba(232,163,61,.28); }
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; }
  *::-webkit-scrollbar-track { background: transparent; }

  /* ============ Masthead ============ */
  .header { background: linear-gradient(180deg, var(--bg-raise) 0%, var(--bg) 100%); border-bottom: 1px solid var(--line); padding: 16px 32px 0; position: sticky; top: 0; z-index: 50; }
  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; }
  .masthead-left { display: flex; align-items: baseline; gap: 14px; }
  .wordmark { font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: 2px; color: var(--ink); line-height: 1; }
  .wordmark .accent { color: var(--amber); }
  .masthead-meta h1 { font-size: 18px; font-weight: 650; letter-spacing: .5px; }
  .kicker { font-family: var(--mono); font-size: 10px; letter-spacing: 2.5px; color: var(--ink-faint); text-transform: uppercase; margin-top: 3px; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }
  .status::before { content: '●'; margin-right: 6px; color: currentColor; }
  .status.ok { color: var(--green); }
  .status.err { color: var(--coral); }
  .header-trace { display: flex; height: 3px; border-radius: 2px 2px 0 0; overflow: hidden; }
  .header-trace i { flex: 1; }
  .trace-orchestrate { background: var(--amber); }
  .trace-plan { background: var(--violet); }
  .trace-exec { background: var(--green); }
  .trace-consult { background: var(--coral); }
  .trace-retrieve { background: var(--cyan); }
  .trace-design { background: var(--rose); }
  .container { max-width: 1120px; margin: 0 auto; padding: 24px 32px 96px; }

  .section { margin-bottom: 34px; }
  .section-title { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 14px; padding: 0 0 8px 10px; border-bottom: 1px solid var(--line); position: relative; }
  .section-title::before { content: ''; position: absolute; left: 0; top: 1px; bottom: 9px; width: 4px; border-radius: 2px; background: var(--amber); }
  .section-title .sub { color: var(--ink-faint); font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 10px; font-size: 11px; }

  /* Intro / legend */
  .intro-box { background: linear-gradient(180deg, var(--bg-raise), var(--panel)); border: 1px solid var(--line); border-radius: 10px; padding: 20px 24px; margin-bottom: 20px; line-height: 1.8; font-size: 13.5px; color: var(--ink-dim); }
  .intro-box b { color: var(--ink); }
  .intro-box .hl { color: var(--amber); font-family: var(--mono); font-weight: 600; }
  .intro-box code { font-family: var(--mono); color: var(--cyan); font-size: 12px; background: rgba(0,0,0,.25); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
  .legend-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-dim); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* Flowchart (signal path) */
  .flow-wrap { background: var(--bg-raise); border: 1px solid var(--line); border-radius: 10px; padding: 26px 20px; overflow-x: auto; }
  .flow-grid { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 760px; }
  .flow-row { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .flow-node { border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 600; text-align: center; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); min-width: 100px; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .flow-node small { display: block; font-weight: 400; font-size: 10.5px; margin-top: 3px; opacity: .85; }
  .flow-node .en { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: 1.5px; opacity: .55; text-transform: uppercase; margin-top: 3px; }
  .flow-node.main { background: rgba(232,163,61,.10); border-color: var(--amber); color: var(--amber-hi); }
  .flow-node.plan { background: rgba(167,139,250,.10); border-color: var(--violet); color: var(--violet); }
  .flow-node.exec { background: rgba(127,201,138,.10); border-color: var(--green); color: var(--green); }
  .flow-node.consult { background: rgba(232,113,95,.10); border-color: var(--coral); color: var(--coral); }
  .flow-node.grep { background: rgba(107,183,201,.10); border-color: var(--cyan); color: var(--cyan); }
  .flow-arrow { color: var(--ink-faint); font-size: 18px; font-family: var(--mono); line-height: 1; }
  .flow-label { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); margin: 3px 0; text-align: center; letter-spacing: 1px; }
  .flow-label::before { content: '▸ '; color: var(--amber); }

  /* Cards */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px 16px 18px; margin-bottom: 12px; position: relative; transition: border-color .18s ease, background .18s ease; }
  .card::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 2px 2px 0; background: var(--line-strong); transition: background .18s ease; }
  .card:hover { border-color: var(--line-strong); background: var(--panel-2); }
  .card.t-orchestrate::before { background: var(--amber); }
  .card.t-plan::before { background: var(--violet); }
  .card.t-exec::before { background: var(--green); }
  .card.t-consult::before { background: var(--coral); }
  .card.t-retrieve::before { background: var(--cyan); }
  .card.t-design::before { background: var(--rose); }
  .card-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .card .name { font-weight: 650; font-size: 15px; min-width: 190px; color: var(--ink); font-family: var(--mono); letter-spacing: .3px; }
  .card .name small { display: block; font-family: var(--sans); font-weight: 400; font-size: 12px; color: var(--ink-dim); margin-top: 3px; line-height: 1.5; }
  .card .name small .role-label { color: var(--ink); font-weight: 600; }
  .card .name small .en { font-family: var(--mono); color: var(--ink-faint); font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; }
  .card .controls { flex: 1; display: flex; gap: 10px; align-items: center; min-width: 320px; flex-wrap: wrap; }
  select, input[type=number], input[type=text] { background: var(--bg); border: 1px solid var(--line); color: var(--ink); padding: 8px 10px; border-radius: 6px; font-size: 13px; outline: none; transition: border-color .18s ease, box-shadow .18s ease; font-family: var(--mono); }
  select:hover, input:hover { border-color: var(--line-strong); }
  select:focus, input:focus { border-color: var(--amber); box-shadow: 0 0 0 2px rgba(232,163,61,.15); }
  select option { background: var(--panel-3); color: var(--ink); }
  .main-select { flex: 1; min-width: 230px; }
  .variant-select { max-width: 110px; }

  /* Tag system: role chips / family chips / meters / badges */
  .tags { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 5px; font-weight: 600; letter-spacing: .8px; white-space: nowrap; text-transform: uppercase; }
  .badge.agent, .badge.category { background: var(--panel-3); color: var(--ink-faint); border: 1px solid var(--line); }
  .badge.free { background: rgba(127,201,138,.12); color: var(--green); border: 1px solid rgba(127,201,138,.3); }
  .badge.paid { background: rgba(232,113,95,.12); color: var(--coral); border: 1px solid rgba(232,113,95,.3); }
  .badge.ro { background: rgba(167,139,250,.10); color: var(--violet); border: 1px solid rgba(167,139,250,.28); }
  .badge.freq { background: transparent; color: var(--ink-dim); border: 1px dashed var(--line-strong); font-weight: 500; text-transform: none; letter-spacing: .3px; }
  .badge.vision { background: rgba(107,183,201,.10); color: var(--cyan); border: 1px solid rgba(107,183,201,.35); font-weight: 600; }

  .role-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; padding: 3px 10px; border-radius: 5px; letter-spacing: .5px; }
  .role-chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
  .type-orchestrate { background: rgba(232,163,61,.12); color: var(--amber); border: 1px solid rgba(232,163,61,.35); }
  .type-plan { background: rgba(167,139,250,.12); color: var(--violet); border: 1px solid rgba(167,139,250,.35); }
  .type-exec { background: rgba(127,201,138,.12); color: var(--green); border: 1px solid rgba(127,201,138,.35); }
  .type-consult { background: rgba(232,113,95,.12); color: var(--coral); border: 1px solid rgba(232,113,95,.35); }
  .type-retrieve { background: rgba(107,183,201,.12); color: var(--cyan); border: 1px solid rgba(107,183,201,.35); }
  .type-design { background: rgba(224,138,166,.12); color: var(--rose); border: 1px solid rgba(224,138,166,.35); }

  .fam-chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 1.2px; padding: 3px 9px; border-radius: 5px; background: transparent; border: 1px solid; text-transform: uppercase; }
  .fam-chip::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .fam-claude { color: var(--fam-claude); border-color: rgba(227,154,107,.45); background: rgba(227,154,107,.08); }
  .fam-gpt { color: var(--fam-gpt); border-color: rgba(92,191,168,.45); background: rgba(92,191,168,.08); }
  .fam-gemini { color: var(--fam-gemini); border-color: rgba(111,168,255,.45); background: rgba(111,168,255,.08); }
  .fam-kimi { color: var(--fam-kimi); border-color: rgba(205,120,216,.45); background: rgba(205,120,216,.08); }
  .fam-minimax { color: var(--fam-minimax); border-color: rgba(227,178,60,.45); background: rgba(227,178,60,.08); }
  .fam-chip.inferred { border-style: dashed; }

  .meter { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: 1px; color: var(--ink-faint); font-weight: 600; }
  .meter .segs { display: inline-flex; gap: 2px; }
  .meter .segs i { width: 7px; height: 11px; border-radius: 1.5px; background: var(--line-strong); }
  .meter .segs i.on { background: var(--amber); }
  .meter.iq1 .segs i.on, .meter.wl1 .segs i.on { background: var(--ink-faint); }
  .meter.iq2 .segs i.on { background: #7fb0d6; }
  .meter.iq3 .segs i.on { background: #e0b060; }
  .meter.iq4 .segs i.on { background: var(--coral); }
  .meter.wl2 .segs i.on { background: var(--green); }
  .meter.wl3 .segs i.on { background: #b3c96f; }
  .meter.wl4 .segs i.on { background: #e0b060; }

  .adv-toggle { font-size: 12px; color: var(--amber); cursor: pointer; margin-top: 12px; display: inline-flex; align-items: center; gap: 5px; user-select: none; font-family: var(--mono); letter-spacing: .5px; }
  .adv-toggle:hover { color: var(--amber-hi); }
  .adv-panel { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line-strong); }
  .adv-panel.open { display: block; }
  .adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .adv-field label { display: block; font-size: 11px; color: var(--ink-faint); margin-bottom: 5px; letter-spacing: .3px; }
  .adv-field input, .adv-field select { width: 100%; }

  .fallback-section { margin-top: 12px; }
  .fallback-title { font-size: 11.5px; color: var(--ink-dim); margin-bottom: 8px; font-family: var(--mono); letter-spacing: .8px; }
  .fallback-list { display: flex; flex-direction: column; gap: 6px; }
  .fallback-row { display: flex; gap: 8px; align-items: center; }
  .fallback-row select { flex: 1; }
  .fb-remove { background: rgba(232,113,95,.1); color: var(--coral); border: 1px solid rgba(232,113,95,.3); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; line-height: 1; font-family: var(--mono); }
  .fb-remove:hover { background: rgba(232,113,95,.22); }
  .fb-add { background: transparent; color: var(--amber); border: 1px dashed rgba(232,163,61,.4); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; margin-top: 6px; font-family: var(--mono); letter-spacing: .5px; }
  .fb-add:hover { background: rgba(232,163,61,.1); border-style: solid; }
  .fb-readonly-note { font-size: 11.5px; color: #e0b060; font-style: italic; margin-top: 4px; background: rgba(224,176,96,.08); border: 1px dashed rgba(224,176,96,.3); border-radius: 6px; padding: 8px 10px; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-dim); }
  .checkbox-row input { width: 16px; height: 16px; accent-color: var(--amber); }

  .btn-bar { display: flex; gap: 12px; margin-top: 26px; justify-content: flex-end; position: sticky; bottom: 14px; }
  .btn { padding: 10px 28px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .18s ease; box-shadow: 0 6px 20px rgba(0,0,0,.45); font-family: var(--sans); }
  .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .btn-primary { background: var(--amber); color: #1a1308; }
  .btn-primary:hover { background: var(--amber-hi); transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--line-strong); color: var(--ink-faint); cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary { background: var(--panel-2); color: var(--ink-dim); border: 1px solid var(--line-strong); box-shadow: none; }
  .btn-secondary:hover { background: var(--panel-3); color: var(--ink); }
  .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 8px; font-size: 13.5px; font-weight: 500; z-index: 999; transform: translateY(80px); opacity: 0; transition: all .3s ease; font-family: var(--mono); letter-spacing: .3px; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.ok { background: var(--panel-2); color: var(--green); border: 1px solid rgba(127,201,138,.5); box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .toast.err { background: var(--panel-2); color: var(--coral); border: 1px solid rgba(232,113,95,.5); }
  .loading { text-align: center; padding: 60px; color: var(--ink-faint); font-size: 15px; font-family: var(--mono); letter-spacing: 1px; }

  /* Tabs */
  .tab-container { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .tab-button { background: transparent; border: 1px solid transparent; border-bottom: none; color: var(--ink-faint); padding: 10px 18px 12px; font-family: var(--mono); font-size: 13px; letter-spacing: 1px; cursor: pointer; position: relative; }
  .tab-button.active { color: var(--amber); border-color: var(--line); border-bottom-color: transparent; background: var(--bg-raise); border-radius: 8px 8px 0 0; }
  .tab-button.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--amber); }
  .tab-button:hover:not(.active) { color: var(--ink); }
  .tab-button:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; border-radius: 4px; }
  .tab-panel { display: none; animation: fadeEffect .25s ease; }
  .tab-panel.active { display: block; }
  @keyframes fadeEffect { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .tab-panel, .toast, .card, .btn { transition: none !important; animation: none !important; } }

  /* CCR Tab Styles */
  .ccr-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  .ccr-table th, .ccr-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .ccr-table th { color: var(--ink-faint); font-weight: 600; background: var(--bg-raise); font-family: var(--mono); font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; }
  .ccr-table tr:hover { background: var(--panel); }
  .ccr-table code { font-family: var(--mono); font-size: 11.5px; color: var(--cyan); }
  .ccr-route-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .ccr-route-card:hover { border-color: var(--line-strong); }
  .ccr-route-label { font-weight: 600; font-size: 14px; min-width: 120px; color: var(--ink); }
  .ccr-route-label small { display: block; font-weight: 400; font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  .ccr-route-controls { flex: 1; display: flex; gap: 10px; align-items: center; min-width: 300px; }
  .ccr-route-controls select { flex: 1; min-width: 150px; }
  .ccr-provider-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; }
  .ccr-provider-card:hover { border-color: var(--line-strong); }
  .ccr-provider-header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .ccr-provider-name { font-weight: 600; font-size: 15px; color: var(--ink); font-family: var(--mono); }
  .ccr-provider-name small { display: block; font-family: var(--sans); font-weight: 400; font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
  .ccr-provider-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .ccr-badge { font-family: var(--mono); font-size: 10px; padding: 3px 9px; border-radius: 5px; font-weight: 600; letter-spacing: .8px; white-space: nowrap; text-transform: uppercase; }
  .ccr-badge.anthropic { background: rgba(227,154,107,.1); color: var(--fam-claude); border: 1px solid rgba(227,154,107,.35); }
  .ccr-badge.openai { background: rgba(92,191,168,.1); color: var(--fam-gpt); border: 1px solid rgba(92,191,168,.35); }
  .ccr-badge.custom { background: rgba(127,201,138,.1); color: var(--green); border: 1px solid rgba(127,201,138,.35); }
  .ccr-models-toggle { font-size: 12px; color: var(--amber); cursor: pointer; margin-top: 10px; display: inline-flex; align-items: center; gap: 4px; user-select: none; font-family: var(--mono); letter-spacing: .5px; }
  .ccr-models-toggle:hover { color: var(--amber-hi); }
  .ccr-models-list { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-strong); }
  .ccr-models-list.open { display: block; }
  .ccr-models-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .ccr-model-tag { font-family: var(--mono); font-size: 11px; padding: 4px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; color: var(--ink-dim); }
  .ccr-anthropic-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  .ccr-anthropic-table th, .ccr-anthropic-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; }
  .ccr-anthropic-table th { color: var(--ink-faint); font-weight: 600; background: var(--bg-raise); }
  .ccr-anthropic-table tr:hover { background: var(--panel); }

  @media (max-width: 640px) {
    .header { padding: 14px 16px 0; }
    .container { padding: 20px 16px 96px; }
    .masthead { flex-direction: column; align-items: flex-start; }
    .card-top { flex-direction: column; align-items: flex-start; }
    .card .name { min-width: auto; }
    .card .controls { width: 100%; }
  }
  </style>
</head>
<body>
<div class="header">
  <div class="masthead">
    <div class="masthead-left">
      <div class="wordmark">OMO<span class="accent">_</span></div>
      <div class="masthead-meta">
        <h1>AI 团队模型调度台</h1>
        <div class="kicker">Agent Dispatch Console · 席位配置 × 模型路由</div>
      </div>
    </div>
    <div class="status" id="status">Loading...</div>
  </div>

function providerOf(model) {
  if (!model) return '';
  return model.split('/')[0];
}
function isFree(model) {
  if (!model) return false;
  return model.includes(':free') || model.includes('-free');
}
function toast(msg, ok = true) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(() => el.className = 'toast', 3000);
}

function modelOptionsHtml(selectedModel, visionOnly) {
  let html = '';
  let currentProvider = '';
  html += `<option value="">-- 无 --</option>`;
  const list = visionOnly ? models.filter(m => VISION_MODELS.has(m) || m === selectedModel) : models;
  for (const m of list) {
    const p = providerOf(m);
    if (p !== currentProvider) {
      if (currentProvider) html += '</optgroup>';
      currentProvider = p;
      html += `<optgroup label="${p}">`;
    }
    const sel = m === selectedModel ? ' selected' : '';
    const vtag = VISION_MODELS.has(m) ? ' (vision)' : '';
    const warn = visionOnly && !VISION_MODELS.has(m) ? ' ⚠ 当前配置不支持图片' : '';
    html += `<option value="${m}"${sel}>${m}${vtag}${warn}</option>`;
  }
  if (currentProvider) html += '</optgroup>';
  return html;
}

function renderMainSelect(selectedModel, visionOnly) {
  let html = `<select class="main-select" data-original="${selectedModel || ''}">`;
  let currentProvider = '';
  const list = visionOnly ? models.filter(m => VISION_MODELS.has(m) || m === selectedModel) : models;
  for (const m of list) {
    const p = providerOf(m);
    if (p !== currentProvider) {
      if (currentProvider) html += '</optgroup>';
      currentProvider = p;
      html += `<optgroup label="${p}">`;
    }
    const sel = m === selectedModel ? ' selected' : '';
    const vtag = VISION_MODELS.has(m) ? ' (vision)' : '';
    const warn = visionOnly && !VISION_MODELS.has(m) ? ' ⚠ 当前配置不支持图片' : '';
    html += `<option value="${m}"${sel}>${m}${vtag}${warn}</option>`;
  }
  if (currentProvider) html += '</optgroup>';
  html += '</select>';
  return html;
}

function variantSelect(current) {
  const opts = ['', 'low', 'medium', 'high'];
  let html = '<select class="variant-select" title="Variant / Reasoning Effort">';
  for (const v of opts) {
    const sel = v === (current || '') ? ' selected' : '';
    const label = v || '默认';
    html += `<option value="${v}"${sel}>${label}</option>`;
  }
  html += '</select>';
  return html;
}

function fallbackHtml(cfg, visionOnly) {
  const list = Array.isArray(cfg.fallback_models) ? cfg.fallback_models : [];
  const hasComplex = list.some(x => typeof x !== 'string');
  if (hasComplex) {
    return `<div class="fallback-section">
      <div class="fallback-title">降级模型 (Fallback Models)</div>
      <div class="fb-readonly-note">⚠ 检测到高级 fallback 配置（含 per-model 参数），此界面暂不支持编辑，保存时将原样保留。请直接编辑 JSON 文件。</div>
    </div>`;
  }
  let rows = '';
  list.forEach((m) => {
    rows += `<div class="fallback-row"><select class="fb-select">${modelOptionsHtml(m, visionOnly)}</select><button type="button" class="fb-remove" onclick="removeFallback(this)">×</button></div>`;
  });
  const visionNote = visionOnly ? '<div class="fb-readonly-note">👁 视觉 agent：仅显示支持图片输入的模型</div>' : '';
  return `<div class="fallback-section">
    <div class="fallback-title">降级模型 (Fallback Models) — 主模型出错/超限时按顺序尝试</div>
    <div class="fallback-list">${rows}</div>
    ${visionNote}
    <button type="button" class="fb-add" onclick="addFallback(this, ${visionOnly ? 'true' : 'false'})">+ 添加降级模型</button>
  </div>`;
}

function addFallback(btn, visionOnly) {
  const section = btn.parentElement;
  const list = section.querySelector('.fallback-list');
  const row = document.createElement('div');
  row.className = 'fallback-row';
  row.innerHTML = `<select class="fb-select">${modelOptionsHtml('', visionOnly)}</select><button type="button" class="fb-remove" onclick="removeFallback(this)">×</button>`;
  list.appendChild(row);
}
function removeFallback(btn) {
  btn.parentElement.remove();
}

function advPanelHtml(cfg, uid) {
  const temp = cfg.temperature ?? '';
  const topP = cfg.top_p ?? '';
  const tools = Array.isArray(cfg.tools) ? cfg.tools.join(', ') : (cfg.tools || '');
  const disabled = !!cfg.disable;
  return `
    <div class="adv-panel" id="adv-${uid}">
      <div class="adv-grid">
        <div class="adv-field">
          <label>Temperature</label>
          <input type="number" step="0.1" min="0" max="2" class="adv-temperature" value="${temp}" placeholder="默认">
        </div>
        <div class="adv-field">
          <label>Top P</label>
          <input type="number" step="0.05" min="0" max="1" class="adv-top_p" value="${topP}" placeholder="默认">
        </div>
        <div class="adv-field">
          <label>Tools 白名单 (逗号分隔，留空=全部)</label>
          <input type="text" class="adv-tools" value="${tools}" placeholder="e.g. read, grep, bash">
        </div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" class="adv-disable" ${disabled ? 'checked' : ''} id="disable-${uid}">
        <label for="disable-${uid}">禁用此 agent（disable）</label>
      </div>
    </div>`;
}

const ROLE_LABEL = { orchestrate: '编排', plan: '规划', exec: '执行', consult: '咨询', retrieve: '检索', design: '创意' };
const FAMILY_LABEL = { claude: 'CLAUDE', gpt: 'GPT', gemini: 'GEMINI', kimi: 'KIMI', minimax: 'MINIMAX' };
const FAMILY_TITLE = {
  claude: 'Claude 系 · 指令跟随 / 结构化输出',
  gpt: 'GPT 系 · 显式推理 / 原则驱动',
  gemini: 'Gemini · 视觉能力强',
  kimi: 'Kimi · K3 接近 Claude 行为 / highspeed 快速廉价',
  minimax: 'MiniMax · 工具型 / 搜索型',
};

function roleChip(meta) {
  const t = meta.type || 'exec';
  return `<span class="role-chip type-${t}">${ROLE_LABEL[t] || '任务'}</span>`;
}
function familyChip(meta) {
  if (!meta.family) return '';
  const inferred = !!meta.familyInferred;
  const tag = FAMILY_LABEL[meta.family] || meta.family;
  const note = inferred ? '（依据角色推断）' : '（文档推荐）';
  return `<span class="fam-chip fam-${meta.family}${inferred ? ' inferred' : ''}" title="${FAMILY_TITLE[meta.family] || ''}${note}">${tag}</span>`;
}

function meterBadge(kind, level, label, levelLabel) {
  let segs = '';
  for (let i = 1; i <= 4; i++) segs += `<i class="${i <= level ? 'on' : 'off'}"></i>`;
  return `<span class="meter ${kind}${level}" title="${label} · ${levelLabel}"><b>${label}</b><span class="segs">${segs}</span></span>`;
}
function iqBadge(iq) { return meterBadge('iq', iq, 'IQ', IQ_LABEL[iq]); }
function wlBadge(wl) { return meterBadge('wl', wl, 'LOAD', WL_LABEL[wl]); }

function toggleAdv(uid) {
  const el = document.getElementById('adv-' + uid);
  el.classList.toggle('open');
  const toggle = el.previousElementSibling;
  toggle.textContent = toggle.textContent.replace(/^[▸▾]/, el.classList.contains('open') ? '▾' : '▸');
}

async function saveConfig() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';

  document.querySelectorAll('.card').forEach(card => {
    const key = card.dataset.key;
    const name = card.dataset.name;
    const model = card.querySelector('select.main-select').value;
    const variant = card.querySelector('.variant-select').value;
    const temperature = card.querySelector('.adv-temperature').value;
    const topP = card.querySelector('.adv-top_p').value;
    const toolsStr = card.querySelector('.adv-tools').value;
    const disable = card.querySelector('.adv-disable').checked;

    const target = key === 'agent' ? config.agents : config.categories;
    if (!target[name]) target[name] = {};
    const cfg = target[name];

    cfg.model = model;
    if (variant) cfg.variant = variant; else delete cfg.variant;
    if (temperature !== '') cfg.temperature = parseFloat(temperature); else delete cfg.temperature;
    if (topP !== '') cfg.top_p = parseFloat(topP); else delete cfg.top_p;
    if (toolsStr.trim()) cfg.tools = toolsStr.split(',').map(s => s.trim()).filter(Boolean); else delete cfg.tools;
    if (disable) cfg.disable = true; else delete cfg.disable;

    const fbSelects = card.querySelectorAll('.fb-select');
    const hasReadonlyNote = card.querySelector('.fb-readonly-note');
    if (!hasReadonlyNote) {
      const fbValues = Array.from(fbSelects).map(s => s.value).filter(Boolean);
      if (fbValues.length) cfg.fallback_models = fbValues; else delete cfg.fallback_models;
    }
  });

  try {
    const res = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    });
    const data = await res.json();
    if (data.ok) {
      toast('配置已保存 ✓ (重启 OpenCode 生效)');
      document.getElementById('status').textContent = 'Saved ✓';
      document.getElementById('status').className = 'status ok';
    } else {
      toast('保存失败: ' + data.error, false);
    }
  } catch (e) {
    toast('网络错误: ' + e.message, false);
  }

  btn.disabled = false;
  btn.textContent = '保存配置';
}

async function fetchCCRConfig() {
  try {
    const res = await fetch('/api/ccr/config');
    const data = await res.json();
    if (data.ok) {
      ccrConfig = data.config;
      return true;
    } else {
      throw new Error(data.error);
    }
  } catch (e) {
    console.error('Failed to fetch CCR config:', e);
    return false;
  }
}

// Normalize a model entry (may be a plain string id or a detailed object) to its id string
function modelId(m) {
  return typeof m === 'string' ? m : m.id;
}
// Get array of model id strings from a provider's models[] (mixed string/object)
function modelIds(provider) {
  return (provider?.models || []).map(modelId);
}

// 从 qualified "provider/model" 格式中提取裸模型名
function bareModel(qualified) {
  const i = qualified.indexOf('/');
  return i >= 0 ? qualified.slice(i + 1) : qualified;
}

// 从 qualified "provider/model" 中提取 provider 名
function providerFromQualified(qualified) {
  const i = qualified.indexOf('/');
  return i >= 0 ? qualified.slice(0, i) : null;
}

// Working in-memory copy of the 3 chains: { opus: [modelId,...], sonnet: [...], haiku: [...] }
let ccrChains = null;
let ccrRetryCount = { opus: 1, sonnet: 1, haiku: 1 };

function buildChainsFromConfig() {
  const rules = ccrConfig.Router?.rules || [];
  const findRule = (id) => rules.find(r => r.id === id);
  const opusRule = findRule('fallback-opus');
  const sonnetRule = findRule('fallback-sonnet');
  const haikuRule = findRule('fallback-haiku');
  ccrChains = {
    opus: (opusRule?.fallback?.models || []).slice(),
    sonnet: (sonnetRule?.fallback?.models || []).slice(),
    haiku: (haikuRule?.fallback?.models || []).slice(),
  };
  ccrRetryCount = {
    opus: opusRule?.fallback?.retryCount ?? 1,
    sonnet: sonnetRule?.fallback?.retryCount ?? 1,
    haiku: haikuRule?.fallback?.retryCount ?? 1,
  };
}

function findProviderForModel(modelIdToFind) {
  const providers = ccrConfig.Providers || [];
  if (!modelIdToFind) return null;
  // 如果有 provider/ 前缀，直接取前缀部分
  const slashIdx = modelIdToFind.indexOf('/');
  if (slashIdx > 0) {
    const providerName = modelIdToFind.slice(0, slashIdx);
    const bare = modelIdToFind.slice(slashIdx + 1);
    // 先精确匹配 provider 名
    if (providers.find(p => p.name === providerName || p.id === providerName)) {
      return providerName;
    }
    // 然后用裸名在 provider 的 models 里找
    for (const p of providers) {
      if (modelIds(p).includes(bare)) return p.name;
    }
  }
  // 否则用原始值遍历（兼容裸名查找）
  for (const p of providers) {
    if (modelIds(p).includes(modelIdToFind)) return p.name;
  }
  return null;
}

function renderChainCards() {
  if (!ccrChains) buildChainsFromConfig();

    { key: 'sonnet', label: 'Sonnet', desc: '主力编码模型' },
    { key: 'haiku', label: 'Haiku', desc: '轻量快速任务' },
  ];

  let html = '';
  kinds.forEach(kind => {
    const chain = ccrChains[kind.key] || [];
    const primary = chain[0] || '';
    const primaryBare = bareModel(primary);
    const primaryProvider = providerFromQualified(primary) || findProviderForModel(primary) || '';

    html += `
    <div class="ccr-provider-card" data-kind="${kind.key}">
      <div class="ccr-provider-header" style="margin-bottom: 12px;">
        <div class="ccr-provider-name">
          ${kind.label}
          <small>${kind.desc}</small>

      </div>

        </select>
        <select class="chain-primary-model" data-kind="${kind.key}">
          <option value="">-- Model --</option>
          ${modelIds(providers.find(p => p.name === primaryProvider)).map(m => `<option value="${m}" ${m === primaryBare ? 'selected' : ''}>${m}</option>`).join('')}
        </select>
      </div>

      <div class="fallback-section">
        <div class="fallback-title">降级候选（primary 失败时按顺序依次尝试）</div>
        <div class="fallback-list" data-kind="${kind.key}">
          ${chain.slice(1).map((m, idx) => renderFallbackRow(kind.key, m, idx + 1, chain.length)).join('')}
        </div>
        <div style="display:flex; gap:8px; align-items:center; margin-top:10px;">
          <select class="chain-add-provider" data-kind="${kind.key}" style="max-width:160px;">
            <option value="">-- Provider --</option>
            ${providers.map(p => `<option value="${p.name}">${p.name}</option>`).join('')}
          </select>
          <select class="chain-add-model" data-kind="${kind.key}" style="max-width:220px;">
            <option value="">-- Model --</option>
          </select>
          <button class="fb-add" data-kind="${kind.key}" data-action="add-fallback">+ 添加降级模型</button>
        </div>
      </div>

      <div style="margin-top: 14px; display: flex; align-items: center; gap: 8px;">

               value="${ccrRetryCount[kind.key]}" min="0" max="5"
               style="width: 60px; padding: 4px 8px; background: var(--bg); border: 1px solid var(--line);
                      border-radius: 4px; color: var(--ink); font-size: 13px; text-align: center;">
        <span style="font-size: 11px; color: var(--ink-faint);">0=首选失败直接降级</span>
      </div>

      <div class="btn-bar" style="margin-top: 16px; justify-content: flex-start; position: static;">
        <button class="btn btn-primary chain-save-btn" data-kind="${kind.key}">保存 ${kind.label}</button>
      </div>
    </div>`;
  });

  container.innerHTML = html;
  bindChainEvents();
  renderGlobalFallback();
}

function renderFallbackRow(kind, modelId, indexInChain, chainLength) {
  const providerName = providerFromQualified(modelId) || findProviderForModel(modelId) || '?';
  const badgeNum = indexInChain + 1; // since primary is ①
  return `
    <div class="fallback-row" data-kind="${kind}" data-model="${modelId}">
      <span class="ccr-badge" style="background:var(--panel-3);color:var(--ink-dim); min-width:22px; text-align:center;">${badgeNum}</span>
      <span style="flex:1; font-size:13px; color:var(--ink);">${modelId} <small style="color:var(--ink-faint);">(${providerName})</small></span>
      <button class="fb-remove" data-action="move-up" data-kind="${kind}" data-model="${modelId}" title="上移" ${indexInChain === 0 ? 'disabled style="opacity:0.3;cursor:not-allowed;"' : ''}>↑</button>
      <button class="fb-remove" data-action="move-down" data-kind="${kind}" data-model="${modelId}" title="下移">↓</button>
      <button class="fb-remove" data-action="remove-fallback" data-kind="${kind}" data-model="${modelId}" title="删除">✕</button>
    </div>`;
}

function bindChainEvents() {
  const providers = ccrConfig.Providers || [];

  // Primary provider change -> repopulate primary model select
  document.querySelectorAll('.chain-primary-provider').forEach(sel => {
    sel.addEventListener('change', () => {
      const kind = sel.getAttribute('data-kind');
      const provider = providers.find(p => p.name === sel.value);
      const modelSel = document.querySelector(`.chain-primary-model[data-kind="${kind}"]`);
      modelSel.innerHTML = '<option value="">-- Model --</option>' +
        modelIds(provider).map(m => `<option value="${m}">${m}</option>`).join('');
    });
  });

  // Primary model change -> update ccrChains so old primary moves to fallback
  document.querySelectorAll('.chain-primary-model').forEach(sel => {
    sel.addEventListener('change', () => {
      const kind = sel.getAttribute('data-kind');
      const newPrimary = sel.value;
      if (!newPrimary) return;
      const oldChain = ccrChains[kind] || [];
      const oldPrimary = oldChain[0] || '';
      if (oldPrimary === newPrimary) return;
      // Move old primary to first fallback slot if not already there
      const rest = oldChain.slice(1).filter(m => m !== newPrimary);
      if (oldPrimary && !rest.includes(oldPrimary)) {
        rest.unshift(oldPrimary);
      }
      ccrChains[kind] = [newPrimary, ...rest];
      toast(`首选模型已切换 → 旧模型 ${oldPrimary} 自动移至降级候选`, true);
      renderChainCards(); // re-render to show updated fallback list
    });
  });

  // Add-fallback provider change -> repopulate add-fallback model select
  document.querySelectorAll('.chain-add-provider').forEach(sel => {
    sel.addEventListener('change', () => {
      const kind = sel.getAttribute('data-kind');
      const provider = providers.find(p => p.name === sel.value);
      const modelSel = document.querySelector(`.chain-add-model[data-kind="${kind}"]`);
      modelSel.innerHTML = '<option value="">-- Model --</option>' +
        modelIds(provider).map(m => `<option value="${m}">${m}</option>`).join('');
    });
  });

  // Add fallback button
  document.querySelectorAll('[data-action="add-fallback"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const kind = btn.getAttribute('data-kind');
      const modelSel = document.querySelector(`.chain-add-model[data-kind="${kind}"]`);
      const modelId = modelSel.value;
      if (!modelId) { toast('请先选择要添加的模型', false); return; }
      if (!ccrChains[kind]) ccrChains[kind] = [];
      if (ccrChains[kind].includes(modelId)) { toast('该模型已在链中', false); return; }
      ccrChains[kind].push(modelId);
      renderChainCards();
    });
  });

  // Move up / down / remove fallback
  document.querySelectorAll('[data-action="move-up"], [data-action="move-down"], [data-action="remove-fallback"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const kind = btn.getAttribute('data-kind');
      const modelId = btn.getAttribute('data-model');
      const action = btn.getAttribute('data-action');
      const chain = ccrChains[kind];
      const idx = chain.indexOf(modelId);
      if (idx === -1) return;
      if (action === 'remove-fallback') {
        chain.splice(idx, 1);
      } else if (action === 'move-up' && idx > 1) {
        // idx>1 because idx===1 is the first fallback item right after primary(idx 0); allow swapping among fallback items only
        [chain[idx - 1], chain[idx]] = [chain[idx], chain[idx - 1]];
      } else if (action === 'move-down' && idx < chain.length - 1) {
        [chain[idx + 1], chain[idx]] = [chain[idx], chain[idx + 1]];
      }
      renderChainCards();
    });
  });

  // Save button per kind
  document.querySelectorAll('.chain-save-btn').forEach(btn => {
    btn.addEventListener('click', () => saveChain(btn.getAttribute('data-kind'), btn));
  });
}

function renderGlobalFallback() {
  const listEl = document.getElementById('ccr-global-fallback-list');
  const provSel = document.getElementById('ccr-gf-provider');
  const modelSel = document.getElementById('ccr-gf-model');
  if (!listEl || !provSel || !modelSel) return;
  const providers = ccrConfig.Providers || [];

  // 渲染当前全局 fallback 模型标签
  const gf = ccrConfig.Router?.fallback;
  const models = gf?.models || [];
  listEl.innerHTML = models.map((m, i) => {
    const pn = findProviderForModel(m.split('/').slice(-1)[0]) || '?';
    return `<span style="display:inline-flex;align-items:center;gap:4px;background:var(--panel-3);border:1px solid var(--line-strong);border-radius:4px;padding:4px 8px;font-size:12px;color:var(--ink);font-family:var(--mono);">
      ${m} <small style="color:var(--ink-faint);">(${pn})</small>
      <span onclick="removeGlobalFallbackModel('${m}')" style="cursor:pointer;color:var(--coral);margin-left:2px;">✕</span>
    </span>`;
  }).join('') || '<span style="color:var(--ink-faint);font-size:13px;">（未配置，使用默认降级策略）</span>';

  // 填充 provider 下拉
  provSel.innerHTML = '<option value="">-- Provider --</option>' +
    providers.map(p => `<option value="${p.name}">${p.name}</option>`).join('');

  // provider 变化时联动模型下拉
  provSel.onchange = () => {
    const p = providers.find(pv => pv.name === provSel.value);
    modelSel.innerHTML = '<option value="">-- 模型 --</option>' +
      (p ? p.models.map(m => `<option value="${m}">${m}</option>`).join('') : '');
  };

  // + 添加 按钮
  document.getElementById('ccr-gf-add-btn').onclick = () => {
    const model = modelSel.value;
    if (!model) { toast('请先选择模型', false); return; }
    const pn = findProviderForModel(model);
    const qualified = pn ? `${pn}/${model}` : model;
    if (!ccrConfig.Router) ccrConfig.Router = {};
    if (!ccrConfig.Router.fallback) ccrConfig.Router.fallback = { mode: 'model-chain', models: [], retryCount: 1 };
    if (ccrConfig.Router.fallback.models.includes(qualified)) { toast('已在链中', false); return; }
    ccrConfig.Router.fallback.models.push(qualified);
    renderGlobalFallback();
  };

  // 保存按钮
  document.getElementById('ccr-gf-save-btn').onclick = async () => {
    if (!ccrConfig.Router) ccrConfig.Router = {};
    if (!ccrConfig.Router.fallback) ccrConfig.Router.fallback = { mode: 'model-chain', models: [], retryCount: 1 };
    ccrConfig.Router.fallback.mode = 'model-chain';
    // 用完整 config 覆盖保存
    const res = await fetch('/api/ccr/config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ccrConfig),
    });
    const data = await res.json();
    if (data.ok) {
      toast('全局降级策略已保存 ✓', true);
    } else {
      toast('保存失败: ' + (data.error || 'unknown'), false);
    }
  };
}

function removeGlobalFallbackModel(modelId) {
  if (!ccrConfig.Router?.fallback?.models) return;
  ccrConfig.Router.fallback.models = ccrConfig.Router.fallback.models.filter(m => m !== modelId);
  renderGlobalFallback();
}

async function saveChain(kind, btn) {
  btn.disabled = true;
  const origText = btn.textContent;
  btn.textContent = '保存中...';

  const primaryModelSel = document.querySelector(`.chain-primary-model[data-kind="${kind}"]`);
  const primaryModel = primaryModelSel ? primaryModelSel.value : '';

  if (!primaryModel) {
    toast('请先选择首选模型', false);
    btn.disabled = false;
    btn.textContent = origText;
    return;
  }

  // 将每个模型名转换为 qualified provider/model 格式，避免多个 provider 有同名模型时降级歧义
  // 如果已有 provider 前缀（含 '/'），说明已经是 qualified，不要再拼一次
  const qualifyModel = (m) => {
    if (m.indexOf('/') >= 0) return m; // 已是 qualified，直接返回
    const p = findProviderForModel(m);
    return p ? `${p}/${m}` : m;
  };
  const fallbackRest = (ccrChains[kind] || []).slice(1);
  const fullChain = [qualifyModel(primaryModel), ...fallbackRest.filter(m => m !== primaryModel).map(qualifyModel)];
  ccrChains[kind] = fullChain;

  // Update Router.rules[fallback-<kind>].fallback.models
  if (!ccrConfig.Router) ccrConfig.Router = {};
  if (!ccrConfig.Router.rules) ccrConfig.Router.rules = [];
  const ruleId = 'fallback-' + kind;
  let rule = ccrConfig.Router.rules.find(r => r.id === ruleId);
  const primaryProviderName = findProviderForModel(primaryModel);
  const qualifiedPrimaryModel = primaryProviderName ? `${primaryProviderName}/${primaryModel}` : primaryModel;
  if (!primaryProviderName) {
    console.warn(`[saveChain] Could not find provider for model "${primaryModel}"; writing unqualified model name, this WILL cause 400 model_not_supported errors.`);
  }
  if (!rule) {
    rule = {
      id: ruleId,
      name: kind.charAt(0).toUpperCase() + kind.slice(1) + ' fallback chain',
      type: 'condition',
      enabled: true,
      // condition 必须用 == + 全名，CCR 的 Nm() 只认 == 操作符，ends-with 会被 strip 成 null
      // CC 通过 cloudcli 发送的一直是全名（如 opencode-zen/mimo-v2.5-free），没有裸名情况
      condition: { left: 'request.body.model', operator: '==', right: qualifiedPrimaryModel },
      fallback: { mode: 'model-chain', models: [], retryCount: 1 }
    };
    ccrConfig.Router.rules.push(rule);
  } else {
    rule.condition = { left: 'request.body.model', operator: '==', right: qualifiedPrimaryModel };
  }
  // condition 规则必须有 rewrite 才能被 CCR 标记为 active（否则 fallback 不会被使用）
  // 加一条无害的 rewrite：把模型名设为自己（无实际效果，但激活规则）
  rule.rewrites = [{ key: 'request.body.model', operation: 'set', value: qualifiedPrimaryModel }];
  if (!rule.fallback) rule.fallback = { mode: 'model-chain', models: [], retryCount: 1 };
  // 从 UI 读取重试次数
  const retryInput = document.querySelector(`.chain-retry-count[data-kind="${kind}"]`);
  const retryVal = retryInput ? parseInt(retryInput.value, 10) : 1;
  if (!Number.isFinite(retryVal) || retryVal < 0) {
    toast('重试次数必须是 ≥0 的数字', false);
    btn.disabled = false; btn.textContent = origText; return;
  }
  rule.fallback.retryCount = retryVal;
  ccrRetryCount[kind] = retryVal;
  // 降级链用全名 (provider/model)，这样失败时直接路由到指定 provider，避免裸名回绕到同个 provider
  // condition.right 仍用裸名 (ends-with 匹配兼容裸名/全名)
  rule.fallback.models = fullChain;

  // Update profile.claudeCode.<kind>Model
  // 官方 schema 要求这三个字段是 "Provider name/model name" 完整格式，不能只写裸模型 ID
  // （2026-07-30 修复：之前这里直接塞裸 primaryModel，导致 opus/sonnet/haiku 别名请求全部 400 model_not_supported）
  if (!ccrConfig.profile) ccrConfig.profile = {};
  if (!ccrConfig.profile.claudeCode) ccrConfig.profile.claudeCode = {};
  ccrConfig.profile.claudeCode[kind + 'Model'] = qualifiedPrimaryModel;
  ccrConfig.profile.claudeCode.model = ccrConfig.profile.claudeCode.model || qualifiedPrimaryModel; // 必填顶层字段，若为空则一并补上，避免 "No available models" 报错

  // Update profile.profiles[claude-code].<kind>Model
  if (!ccrConfig.profile.profiles) ccrConfig.profile.profiles = [];
  let ccProfile = ccrConfig.profile.profiles.find(p => p.agent === 'claude-code');
  if (!ccProfile) {
    ccProfile = { agent: 'claude-code', id: 'default-claude-code', name: 'Claude Code', enabled: true };
    ccrConfig.profile.profiles.push(ccProfile);
  }
  ccProfile[kind + 'Model'] = qualifiedPrimaryModel;

  try {
    const res = await fetch('/api/ccr/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ccrConfig),
    });
    const data = await res.json();
    if (data.ok) {
      const viaRpc = data.viaRpc;
      toast(kind.toUpperCase() + ' 已保存 ✓' + (viaRpc ? '' : ' (需重启 CCR 生效)'));
    } else {
      toast('保存失败: ' + data.error, false);
    }
  } catch (e) {
    toast('网络错误: ' + e.message, false);
  }

  btn.disabled = false;
  btn.textContent = origText;
}


function showTab(tabName) {
  // Update tab buttons
  document.querySelectorAll('.tab-button').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
  });
  // Update tab panels
  document.querySelectorAll('.tab-panel').forEach(panel => {
    panel.classList.toggle('active', panel.id === tabName + '-tab-panel');
  });
  // Load CCR data if switching to CCR tab
  if (tabName === 'ccr' && !ccrConfig) {
    renderCCR();
  }
}

async function init() {
  try {
    const [configRes, modelsRes] = await Promise.all([
      fetch('/api/config'),
      fetch('/api/models'),
    ]);
    const configData = await configRes.json();
    const modelsData = await modelsRes.json();

    if (!configData.ok) throw new Error(configData.error);
    config = configData.config;

    if (!modelsData.ok) throw new Error(modelsData.error);
    models = modelsData.models;

    document.getElementById('status').textContent = `Loaded ${Object.keys(config.agents || {}).length} agents, ${Object.keys(config.categories || {}).length} categories, ${models.length} models`;
    document.getElementById('status').className = 'status ok';

    // Render OMO config into the OMO tab panel
    render();
    // Show OMO tab by default
    showTab('omo');

    // Set up tab button click listeners
    document.querySelectorAll('.tab-button').forEach(button => {
      button.addEventListener('click', () => {
        const tab = button.getAttribute('data-tab');
        showTab(tab);
      });
    });
  } catch (e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
    document.getElementById('status').className = 'status err';
    // Show error in OMO panel
    const omoPanel = document.getElementById('omo-tab-panel');
    omoPanel.innerHTML = `<div class="loading">加载失败: ${e.message}</div>`;
  }
}

init();
</script>

</html>
